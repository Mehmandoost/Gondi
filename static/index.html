<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gondi — Book Library</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-title">
        <h1>Gondi</h1>
        <div class="library-row">
          <label class="library-label" for="library-select">Library</label>
          <select id="library-select" aria-label="Active library"></select>
          <button type="button" id="library-new" title="New library">New</button>
          <button type="button" id="library-rename" title="Rename library">Rename</button>
          <button type="button" id="library-delete" title="Delete library">Delete</button>
        </div>
      </div>
      <div class="search-row">
        <input
          type="search"
          id="search-input"
          placeholder="Search title, author, tags…"
          autocomplete="off"
        />
        <button type="button" id="import-btn" class="primary">Import folder</button>
        <label class="upload-btn">
          Upload file
          <input type="file" id="upload-input" accept=".epub,.pdf,.mobi,.azw3" hidden />
        </label>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" id="filters"></aside>
      <section class="grid-wrap">
        <div id="status" class="status" hidden></div>
        <div id="book-grid" class="book-grid"></div>
        <p id="empty-state" class="empty" hidden>
          Your library is empty. Use <strong>Import folder</strong> with a path on this
          machine, or upload a single ebook file.
        </p>
      </section>
      <aside class="detail" id="detail-panel" hidden>
        <button type="button" class="close-detail" id="close-detail" aria-label="Close">
          ×
        </button>
        <div id="detail-content"></div>
      </aside>
    </main>

    <dialog id="import-dialog">
      <form method="dialog" id="import-form">
        <h2>Import folder</h2>
        <p class="hint">Enter an absolute path to a folder of ebook files.</p>
        <input
          type="text"
          id="import-path"
          placeholder="/home/you/Books"
          required
          autocomplete="off"
        />
        <div class="dialog-actions">
          <button type="button" id="import-cancel">Cancel</button>
          <button type="submit" value="ok" class="primary">Import</button>
        </div>
      </form>
    </dialog>

    <div id="reader-overlay" class="reader-overlay" hidden>
      <header class="reader-toolbar">
        <button type="button" id="reader-close">Close</button>
        <span id="reader-title" class="reader-title"></span>
        <select id="reader-format" aria-label="Book format" hidden></select>
        <div class="reader-pager">
          <button type="button" id="reader-prev">Prev</button>
          <label class="reader-page-label">
            Page
            <input type="number" id="reader-page-input" min="1" value="1" />
            /
            <span id="reader-page-count">1</span>
          </label>
          <button type="button" id="reader-next">Next</button>
        </div>
      </header>
      <div class="reader-main">
        <div class="reader-stage-wrap">
          <div id="reader-page" class="reader-page">
            <img id="reader-page-img" class="reader-page-img" alt="" />
            <div id="reader-highlights-layer" class="reader-highlights-layer"></div>
            <div id="reader-text-layer" class="reader-text-layer"></div>
          </div>
          <div id="reader-selection-popover" class="reader-selection-popover" hidden>
            <label class="reader-popover-label" for="reader-new-notation">Notation</label>
            <textarea
              id="reader-new-notation"
              class="reader-popover-textarea"
              rows="3"
              placeholder="Optional note for this highlight…"
            ></textarea>
            <button type="button" id="reader-save-highlight" class="primary">
              Highlight
            </button>
          </div>
        </div>
        <aside class="reader-sidebar">
          <section id="reader-note-editor" class="reader-note-editor" hidden>
            <h3 class="reader-note-editor-title">Edit notation</h3>
            <blockquote id="reader-note-quote" class="reader-note-quote"></blockquote>
            <label class="reader-popover-label" for="reader-note-text">Notation</label>
            <textarea
              id="reader-note-text"
              class="reader-note-text"
              rows="5"
              placeholder="Write your notation…"
            ></textarea>
            <div class="reader-note-actions">
              <button type="button" id="reader-note-save" class="primary">Save notation</button>
              <button type="button" id="reader-note-delete" class="danger">Delete highlight</button>
            </div>
          </section>
          <h3 class="reader-sidebar-title">Highlights on this page</h3>
          <ul id="reader-highlight-list" class="reader-highlight-list"></ul>
        </aside>
      </div>
    </div>

    <dialog id="metadata-dialog">
      <form method="dialog">
        <h2>Metadata from Open Library</h2>
        <div id="metadata-list" class="metadata-list"></div>
        <div class="dialog-actions">
          <button type="submit" value="cancel">Close</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
